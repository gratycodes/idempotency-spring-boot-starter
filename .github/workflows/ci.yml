name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test (unit, H2, HTTP end-to-end, PostgreSQL and Redis via Testcontainers, sample app)
        run: mvn -B -ntp verify

      - name: Fail if any Testcontainers suite was skipped
        run: |
          reports=idempotency-spring-boot-starter/target/surefire-reports
          count=0
          for f in "$reports"/*ContainerTest.txt; do
            cat "$f"
            grep -Eq "Tests run: [1-9][0-9]*, Failures: 0, Errors: 0, Skipped: 0" "$f" || { echo "::error::$f did not run"; exit 1; }
            count=$((count + 1))
          done
          test "$count" -eq 5 || { echo "::error::expected 5 container suites, found $count"; exit 1; }

      - name: Test summary
        if: always()
        run: |
          for f in */target/surefire-reports/*.txt; do sed -n 4p "$f"; done | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: surefire-reports
          path: "*/target/surefire-reports"
